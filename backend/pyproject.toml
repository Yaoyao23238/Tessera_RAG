[project]
name = "tessera"
version = "0.1.0"
description = "本地 RAG 文档摄入工具：多格式解析 → 智能切分 → 向量化 → 存储 → 检索验证"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",          # 文件上传
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "aiosqlite>=0.20",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.3",
    "docling>=2.5",                     # 文档解析（MIT）
    "FlagEmbedding>=1.3",               # BGE-M3 稠密+稀疏
    "sentence-transformers>=3.0",       # Qwen3-Embedding / bge-reranker-v2-m3
    "torch>=2.2",                       # CPU 版即可
    "lancedb>=0.13",                    # 默认向量库
    "tantivy>=0.21",                    # LanceDB FTS 索引依赖
    "sqlite-vec>=0.1",                  # 兜底向量库
    "qdrant-client>=1.10",
    "psycopg[binary]>=3.1",             # pgvector 档
    "pgvector>=0.3",
    "httpx>=0.27",                      # OpenAI 兼容 API（LLM/Embedding）
    "tenacity>=8.4",                    # 重试（指数退避）
    "numpy>=1.26",
    "aiofiles>=23.2",
    "huggingface-hub>=0.24",            # 模型按需下载（model_manager）
    "tiktoken>=0.7",                    # token 计数（统计口径统一）
    "charset-normalizer>=3.0",          # TXT 编码自动检测（硬编码 UTF-8 的替代）
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
