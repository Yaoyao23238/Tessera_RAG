# Tessera 一键启动（P2 骨架，T05 完善）
# 默认本地运行无需 compose；本文件用于可选的容器化部署与 Qdrant/pgvector 档位。
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8766:8766"
    volumes:
      - tessera-data:/data
    environment:
      - TESSERA_DATA_DIR=/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

  # 中档向量库（可选）：取消注释并在设置页切换 backend=qdrant
  # qdrant:
  #   image: qdrant/qdrant:latest
  #   ports:
  #     - "6333:6333"
  #   volumes:
  #     - qdrant-data:/qdrant/storage

  # 大档向量库（可选）：取消注释并切换 backend=pgvector
  # postgres:
  #   image: pgvector/pgvector:pg16
  #   environment:
  #     - POSTGRES_PASSWORD=tessera
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - pg-data:/var/lib/postgresql/data

volumes:
  tessera-data:
  # qdrant-data:
  # pg-data:
